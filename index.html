<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Agenda ouvert et collaboratif des événements de l'île de La Réunion.">
<title>Événements de La Réunion</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌋</text></svg>">
<style>
  :root {
    color-scheme: light; /* fixed light theme, matching the prototype */

    /* — Surfaces (Vigie design system) — */
    --background: #f7f8fa;
    --foreground: #141c2e;
    --card: #ffffff;
    --card-elevated: #f0f3f8;
    --cell: #f4f6fa;
    --popover: #ffffff;
    --muted: #eef0f4;
    --muted-fg: #5f7089;
    --text-secondary: #3a4e6e;
    --border: #d8dce5;
    --border-strong: #c5cbd8;
    --primary: #4a6fa5;
    --primary-strong: #3b5d92; /* primary ink on tinted backgrounds (AA at 11px) */
    --primary-fg: #ffffff;

    /* — "Signal" states → one category, one color (bg + text + dot) — */
    --Culture-bg: #e6eef8;           --Culture-fg: #2c5490;   --Culture-dot: #4a6fa5;
    --Sport-bg: #e8f3ec;             --Sport-fg: #276b44;     --Sport-dot: #3f9d63;
    --Religieux-bg: #f6efe2;         --Religieux-fg: #7a5d20; --Religieux-dot: #b3872f;
    --Ferie-bg: rgba(220,74,74,.10); --Ferie-fg: #991b1b;     --Ferie-dot: #dc4a4a;

    /* — Radius scale — */
    --r-badge: 3px; --r-sm: 5px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px; --r-2xl: 16px;

    /* — Elevation — */
    --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
    --shadow-md: 0 2px 8px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-2xl: 0 12px 32px rgba(0,0,0,.12);

    /* — Motion — */
    --motion-micro: 140ms; --motion-standard: 240ms;
    --ease-expo: cubic-bezier(.16,1,.3,1);
    --ease-standard: cubic-bezier(.2,0,0,1);

    /* Geist is the prototype's typeface; system-ui as fallback (font not bundled here). */
    --font-sans: "Geist Variable", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font: 16px/1.5 var(--font-sans); margin: 0 auto; padding: 2rem 1.25rem; max-width: 48rem;
    min-height: 100vh; display: flex; flex-direction: column; background: var(--background); color: var(--foreground);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  body.cal-view { max-width: 64rem; } /* the month grid breathes wider than the list */

  /* section-label (mono role: tabular figures, tight uppercase) */
  .label { font-size: 10px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  header h1 { margin: .15rem 0 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
  .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
  select, #today, #upcoming {
    font: inherit; font-size: .875rem; padding: .375rem .625rem; border: 1px solid var(--muted);
    border-radius: var(--r-md); background: var(--card); color: inherit; cursor: pointer;
    transition: background var(--motion-micro) var(--ease-standard), transform var(--motion-micro) var(--ease-standard);
  }
  #today, #upcoming { color: var(--muted-fg); background: none; }
  select:hover, #today:hover, #upcoming:hover { background: var(--muted); }
  select:active, #today:active, #upcoming:active { transform: scale(.98); }
  /* Active filter: the state is visible without reopening the menu. */
  select.active { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, var(--card)); color: var(--primary-strong); }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* View switcher: segmented control, same "active filter" vocabulary as select.active */
  .views { margin-left: auto; display: flex; padding: 2px; gap: 2px; border: 1px solid var(--muted); border-radius: var(--r-md); background: var(--card); }
  .views button {
    display: inline-flex; align-items: center; gap: .35rem;
    font: inherit; font-size: .8rem; padding: .25rem .6rem; border: 0; border-radius: calc(var(--r-md) - 2px);
    background: none; color: var(--muted-fg); cursor: pointer;
    transition: background var(--motion-micro) var(--ease-standard), color var(--motion-micro) var(--ease-standard);
  }
  .views svg { flex-shrink: 0; }
  .views button:hover { background: var(--muted); }
  .views button[aria-pressed="true"] { background: color-mix(in srgb, var(--primary) 8%, var(--card)); color: var(--primary-strong); font-weight: 600; }

  .card { margin-top: 1rem; flex: 1; display: flex; flex-direction: column; border: 1px solid var(--muted); border-radius: var(--r-xl); background: var(--card); padding: .5rem; }

  /* — Agenda (schedule) — */
  .schedule:not([hidden]) { display: flex; flex-direction: column; }
  .month-head {
    position: sticky; top: 0; z-index: 1; background: var(--card);
    padding: .85rem .75rem .35rem; display: flex; align-items: baseline; gap: .5rem;
  }
  .month-head h2 { margin: 0; font-size: 1rem; font-weight: 700; letter-spacing: -.01em; text-transform: capitalize; }
  .month-head .count { font-size: 11px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }

  .row {
    display: grid; grid-template-columns: 6.5rem auto 1fr; align-items: center; gap: .75rem;
    width: 100%; text-align: left; border: 0; border-radius: var(--r-lg); background: none; color: inherit;
    padding: .6rem .75rem; cursor: pointer;
    transition: background var(--motion-micro) var(--ease-standard), transform var(--motion-micro) var(--ease-standard);
  }
  .row + .row { border-top: 1px solid var(--muted); border-radius: 0; }
  .row:hover { background: var(--cell); }
  .row:active { transform: scale(.995); }
  .row.past { opacity: .5; filter: saturate(.5); }
  .row.today { background: color-mix(in srgb, var(--primary) 7%, transparent); }

  .when { display: flex; align-items: center; justify-content: center; gap: .3rem; line-height: 1.05; }
  .when .date { display: flex; flex-direction: column; align-items: center; }
  .when .d { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .when .wd { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-fg); }
  .when .arrow { font-size: .8rem; color: var(--muted-fg); }
  .today .when .d { color: var(--primary); }

  /* Category-colored dot */
  .dot { width: 10px; height: 10px; border-radius: 999px; background: var(--dot); flex-shrink: 0; box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot) 15%, transparent); }

  .body { min-width: 0; }
  .row h3 { margin: 0; font-size: .95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { margin: .15rem 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .6rem; font-size: .78rem; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  .meta .cat { color: var(--fg); font-weight: 500; }
  .meta .sep { color: var(--border-strong); }

  .empty { text-align: center; color: var(--muted-fg); font-size: .9rem; padding: 3rem 1rem; }

  /* — Calendar (month grid) — */
  #calendar:not([hidden]) { flex: 1; display: flex; flex-direction: column; padding: .5rem; }
  .nav { display: flex; align-items: center; justify-content: center; gap: .25rem; margin-bottom: .75rem; }
  .nav button { font: inherit; width: 2.75rem; height: 2.75rem; border: 0; border-radius: var(--r-md); background: none; color: var(--muted-fg); cursor: pointer; font-size: 1.3rem; transition: background var(--motion-micro) var(--ease-standard), transform var(--motion-micro) var(--ease-standard); }
  .nav button:hover { background: var(--muted); }
  .nav button:active { transform: scale(.98); }
  .nav h2 { margin: 0; min-width: 10rem; text-align: center; font-size: 1.125rem; font-weight: 700; }

  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
  #days { flex: 1; }
  .grid .wd { padding: .375rem 0; text-align: center; font: 600 11px/1 var(--font-sans); font-variant-numeric: tabular-nums; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-fg); }
  .day {
    display: flex; flex-direction: column; padding: .375rem; border: 0; border-radius: var(--r-sm);
    background: var(--cell); text-align: left; cursor: pointer; color: inherit; overflow: hidden;
    transition: transform var(--motion-micro) var(--ease-standard), box-shadow var(--motion-micro) var(--ease-standard);
  }
  .day:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .day.out { visibility: hidden; pointer-events: none; }
  .day.past { opacity: .4; filter: saturate(.3); }
  .daynum { align-self: flex-start; font-size: 11px; font-weight: 500; color: var(--muted-fg); }
  /* Today: filled pill on the day number (Apple Calendar style), cell stays like the others. */
  .day.today .daynum { background: var(--primary); color: var(--primary-fg); font-weight: 600; border-radius: 999px; min-width: 18px; text-align: center; padding: 2px 5px; margin: -2px 0 0 -3px; }
  .chips { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
  .chip {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 1px 4px; border-radius: var(--r-sm); font-size: 10px; line-height: 1.35;
    background: var(--tint); color: var(--fg);
  }
  .more { padding: 0 4px; font-size: 10px; color: var(--muted-fg); }

  dialog {
    width: 100%; max-width: 28rem; border: 1px solid var(--border-strong); border-radius: var(--r-2xl);
    background: var(--popover); color: var(--foreground); padding: 1.5rem; box-shadow: var(--shadow-2xl);
  }
  dialog::backdrop { background: #00000080; }
  dialog[open] { animation: slide-up var(--motion-standard) var(--ease-expo); }
  @keyframes slide-up { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } }
  .dhead { display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem; margin-bottom: 1rem; }
  .dhead h3 { margin: .15rem 0 0; font-size: 1.125rem; font-weight: 700; letter-spacing: -.01em; }
  .close { border: 0; background: none; font-size: 1.2rem; cursor: pointer; color: var(--muted-fg); padding: .25rem; }
  .close:hover { color: inherit; }
  .devlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; }
  .devlist li { display: flex; align-items: center; gap: .5rem; font-size: .9rem; }
  .badge { flex-shrink: 0; padding: 2px 6px; border-radius: var(--r-badge); font-size: 11px; background: var(--tint); color: var(--fg); white-space: nowrap; }
  .drow .loc { margin: .6rem 0 0; font-size: .875rem; color: var(--text-secondary); }
  .drow .dates { margin: .15rem 0 0; font: .78rem/1.4 var(--font-sans); font-variant-numeric: tabular-nums; color: var(--muted-fg); }
  .drow a, footer a { color: var(--primary); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 4px; transition: text-decoration-color var(--motion-micro), color var(--motion-micro); }
  .drow a { font-size: .78rem; }
  .drow a:hover, footer a:hover { text-decoration-color: var(--primary); }

  footer { margin-top: 1.5rem; text-align: center; font-size: .82rem; color: var(--muted-fg); }
  a { color: inherit; }
</style>
</head>
<body>
<header>
  <span class="label">Agenda collaboratif · La Réunion</span>
  <h1>Agenda des événements</h1>
  <div class="filters">
    <select id="cat" aria-label="Filtrer par catégorie"></select>
    <select id="commune" aria-label="Filtrer par commune"></select>
    <div class="views" role="group" aria-label="Affichage">
      <button id="v-list" aria-pressed="true">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5.5 4h8M5.5 8h8M5.5 12h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="2.25" cy="4" r="1" fill="currentColor"/><circle cx="2.25" cy="8" r="1" fill="currentColor"/><circle cx="2.25" cy="12" r="1" fill="currentColor"/></svg>
        Liste
      </button>
      <button id="v-cal" aria-pressed="false">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>
        Calendrier
      </button>
    </div>
    <button id="upcoming" hidden>tout voir</button>
    <button id="today" hidden>aujourd'hui</button>
  </div>
</header>

<main class="card">
  <div class="schedule" id="schedule"></div>
  <div id="calendar" hidden>
    <div class="nav">
      <button id="prev" aria-label="Mois précédent">‹</button>
      <h2 id="month"></h2>
      <button id="next" aria-label="Mois suivant">›</button>
    </div>
    <div class="grid" id="weekdays"></div>
    <div class="grid" id="days"></div>
  </div>
</main>

<dialog id="detail" aria-labelledby="dtitle"></dialog>

<footer>
  <a href="https://github.com/axelearning/reunion-events">proposez un événement sur GitHub ↗</a></footer>

<script>
"use strict";

// Minimal CSV parser (RFC 4180): quoted fields, embedded commas, "" escapes.
function parseCSV(text) {
  const rows = [[]];
  let field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { rows[rows.length - 1].push(field); field = ""; }
    else if (c === "\n") { rows[rows.length - 1].push(field); field = ""; rows.push([]); }
    else if (c !== "\r") field += c;
  }
  rows[rows.length - 1].push(field);
  return rows.filter(r => r.length > 1 || r[0] !== "");
}

// The CSV is editable by anyone via PR: all content is treated as hostile.
function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function safeUrl(s) {
  try { return ["http:", "https:"].includes(new URL(s).protocol) ? s : null; }
  catch { return null; }
}

// One category → an emoji + "signal" tokens (tinted background, text, colored dot).
const CATS = {
  Culture: { emoji: "🎭", tint: "var(--Culture-bg)", fg: "var(--Culture-fg)", dot: "var(--Culture-dot)" },
  Sport: { emoji: "🏃", tint: "var(--Sport-bg)", fg: "var(--Sport-fg)", dot: "var(--Sport-dot)" },
  Religieux: { emoji: "🪔", tint: "var(--Religieux-bg)", fg: "var(--Religieux-fg)", dot: "var(--Religieux-dot)" },
  "Jour férié": { emoji: "🎉", tint: "var(--Ferie-bg)", fg: "var(--Ferie-fg)", dot: "var(--Ferie-dot)" },
};
const catStyle = c => CATS[c] || { emoji: "📅", tint: "var(--muted)", fg: "var(--muted-fg)", dot: "var(--muted-fg)" };
const communesLabel = c => c === "ALL" ? "Toute l'île" : c.split("|").join(", ");

const MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const WEEKDAYS = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const fmtDate = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", year: "numeric" });
const fmtFull = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

function iso(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function fmtRange(e) {
  const d = new Date(e.date_debut + "T00:00:00");
  if (isNaN(d)) return esc(e.date_debut);
  const f = e.date_fin ? new Date(e.date_fin + "T00:00:00") : null;
  return f && !isNaN(f) && e.date_fin !== e.date_debut
    ? `${fmtDate.format(d)} → ${fmtDate.format(f)}`
    : fmtDate.format(d);
}

const now = new Date();
const todayIso = iso(now);
let all = [];
let fCat = "", fCommune = "", fUpcoming = true;
let view = localStorage.getItem("view") === "cal" ? "cal" : "list";
let cursor = { y: now.getFullYear(), m: now.getMonth() };

// Category + commune filters, shared by both views.
function baseFiltered() {
  return all.filter(e =>
    (!fCat || e.categorie === fCat) &&
    (!fCommune || e.communes === "ALL" || e.communes.split("|").includes(fCommune)));
}
// List view adds the upcoming filter and chronological order.
function filtered() {
  return baseFiltered()
    .filter(e => !fUpcoming || (e.date_fin || e.date_debut) >= todayIso)
    .sort((a, b) => a.date_debut.localeCompare(b.date_debut) || a.nom.localeCompare(b.nom, "fr"));
}
function eventsOn(key, list) {
  return list.filter(e => key >= e.date_debut && key <= (e.date_fin || e.date_debut));
}

fetch("reunion_events.csv")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(text => {
    const rows = parseCSV(text.trim());
    const headers = rows[0];
    all = rows.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h, (r[i] ?? "").trim()])));
    initFilters();
    render();
  })
  .catch(() => {
    document.getElementById("schedule").innerHTML = '<p class="empty">Impossible de charger les données.</p>';
  });

function initFilters() {
  const communes = [...new Set(all.flatMap(e => e.communes === "ALL" ? [] : e.communes.split("|")))].sort((a, b) => a.localeCompare(b, "fr"));
  const catSel = document.getElementById("cat");
  catSel.innerHTML = '<option value="">Toutes catégories</option>' +
    Object.keys(CATS).map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  document.getElementById("commune").innerHTML = '<option value="">Toute l\'île</option>' +
    communes.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");

  // Monday-first header, indexing the Sunday-first WEEKDAYS array.
  document.getElementById("weekdays").innerHTML = [1, 2, 3, 4, 5, 6, 0].map(i => `<div class="wd">${WEEKDAYS[i]}</div>`).join("");

  catSel.onchange = e => { fCat = e.target.value; e.target.classList.toggle("active", !!fCat); render(); };
  document.getElementById("commune").onchange = e => { fCommune = e.target.value; e.target.classList.toggle("active", !!fCommune); render(); };

  const upBtn = document.getElementById("upcoming");
  upBtn.textContent = fUpcoming ? "tout voir" : "à venir";
  upBtn.onclick = () => {
    fUpcoming = !fUpcoming;
    upBtn.textContent = fUpcoming ? "tout voir" : "à venir";
    render();
  };

  document.getElementById("prev").onclick = () => move(-1);
  document.getElementById("next").onclick = () => move(1);
  document.getElementById("today").onclick = () => { cursor = { y: now.getFullYear(), m: now.getMonth() }; render(); };
  document.getElementById("v-list").onclick = () => setView("list");
  document.getElementById("v-cal").onclick = () => setView("cal");
}

function setView(v) {
  view = v;
  try { localStorage.setItem("view", v); } catch {}
  render();
}

function move(delta) {
  const d = new Date(cursor.y, cursor.m + delta, 1);
  cursor = { y: d.getFullYear(), m: d.getMonth() };
  render();
}

// Dispatch to the active view; swap the contextual controls with it.
function render() {
  const isCal = view === "cal";
  document.body.classList.toggle("cal-view", isCal);
  document.getElementById("v-list").setAttribute("aria-pressed", String(!isCal));
  document.getElementById("v-cal").setAttribute("aria-pressed", String(isCal));
  document.getElementById("schedule").hidden = isCal;
  document.getElementById("calendar").hidden = !isCal;
  document.getElementById("upcoming").hidden = isCal;
  if (isCal) renderCal(); else { document.getElementById("today").hidden = true; renderList(); }
}

function renderCal() {
  const { y, m } = cursor;
  const list = baseFiltered();
  document.getElementById("month").textContent = `${MONTHS[m]} ${y}`;
  const isCurrent = y === now.getFullYear() && m === now.getMonth();
  document.getElementById("today").hidden = isCurrent;

  const offset = (new Date(y, m, 1).getDay() + 6) % 7; // Monday = 0
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const count = Math.ceil((offset + daysInMonth) / 7) * 7;
  const days = document.getElementById("days");
  days.style.gridTemplateRows = `repeat(${count / 7}, minmax(72px, 1fr))`;

  let html = "";
  for (let i = 0; i < count; i++) {
    const d = new Date(y, m, 1 - offset + i);
    const key = iso(d);
    const inMonth = d.getMonth() === m;
    if (!inMonth) { html += '<div class="day out"></div>'; continue; }
    const evs = eventsOn(key, list);
    const cls = ["day", key < todayIso ? "past" : "", key === todayIso ? "today" : ""].join(" ").trim();
    const label = `${fmtFull.format(d)}, ${evs.length === 0 ? "aucun événement" : evs.length + " événement" + (evs.length > 1 ? "s" : "")}`;
    const chips = evs.slice(0, 3).map(e => {
      const s = catStyle(e.categorie);
      return `<span class="chip" style="--tint:${s.tint};--fg:${s.fg}" title="${esc(e.nom)}">${esc(e.nom)}</span>`;
    }).join("");
    const more = evs.length > 3 ? `<span class="more">+${evs.length - 3}</span>` : "";
    html += `<button class="${cls}" data-key="${key}" aria-label="${esc(label)}"` +
      `${key === todayIso ? ' aria-current="date"' : ""}>` +
      `<span class="daynum">${d.getDate()}</span><span class="chips">${chips}${more}</span></button>`;
  }
  days.innerHTML = html;
  days.querySelectorAll(".day:not(.out)").forEach(b => b.onclick = () => openDay(b.dataset.key));
}

function renderList() {
  const list = filtered();
  const schedule = document.getElementById("schedule");
  if (list.length === 0) {
    schedule.innerHTML = '<p class="empty">Aucun événement ne correspond à ces filtres.</p>';
    return;
  }

  // Group by month (events are already sorted chronologically).
  const groups = [];
  let current = null;
  for (const e of list) {
    const d = new Date(e.date_debut + "T00:00:00");
    const gkey = `${d.getFullYear()}-${d.getMonth()}`;
    if (!current || current.gkey !== gkey) {
      current = { gkey, y: d.getFullYear(), m: d.getMonth(), items: [] };
      groups.push(current);
    }
    current.items.push(e);
  }

  schedule.innerHTML = groups.map(g => {
    const head = `<div class="month-head"><h2>${MONTHS[g.m]} ${g.y}</h2></div>`;
    const rows = g.items.map(e => {
      const s = catStyle(e.categorie);
      const d = new Date(e.date_debut + "T00:00:00");
      const key = iso(d);
      // An ongoing multi-day event is not "past": compare on its end date.
      const cls = ["row", (e.date_fin || key) < todayIso ? "past" : "", key === todayIso ? "today" : ""].join(" ").trim();
      const loc = e.communes === "ALL" ? "🏝️ Toute l'île" : "📍 " + communesLabel(e.communes);
      const label = `${e.nom}, ${fmtRange(e)}, ${e.categorie}, ${communesLabel(e.communes)}`;
      const dateBlock = dd => `<span class="date"><span class="wd">${WEEKDAYS[dd.getDay()]}</span><span class="d">${dd.getDate()}</span></span>`;
      const df = e.date_fin && e.date_fin !== e.date_debut ? new Date(e.date_fin + "T00:00:00") : null;
      const when = df && !isNaN(df)
        ? `${dateBlock(d)}<span class="arrow" aria-hidden="true">→</span>${dateBlock(df)}`
        : dateBlock(d);
      return `<button class="${cls}" data-key="${key}" aria-label="${esc(label)}"` +
        `${key === todayIso ? ' aria-current="date"' : ""}>` +
        `<span class="when">${when}</span>` +
        `<span class="dot" style="--dot:${s.dot}" aria-hidden="true"></span>` +
        `<span class="body"><h3>${esc(e.nom)}</h3>` +
        `<span class="meta"><span class="cat" style="--fg:${s.fg}">${s.emoji} ${esc(e.categorie)}</span>` +
        `<span class="sep">·</span><span class="loc-names">${esc(loc)}</span></span></span>` +
        `</button>`;
    }).join("");
    return head + rows;
  }).join("");

  schedule.querySelectorAll(".row").forEach(b => b.onclick = () => openDay(b.dataset.key));
}

function openDay(key) {
  const evs = eventsOn(key, baseFiltered());
  const title = fmtFull.format(new Date(key + "T00:00:00"));
  const body = evs.length === 0
    ? '<p class="empty" style="padding:1rem">Aucun événement ce jour.</p>'
    : '<ul class="devlist">' + evs.map(e => {
        const s = catStyle(e.categorie);
        const u = safeUrl(e.lien);
        return `<li class="drow" style="display:block"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem">` +
          `<h4 style="margin:0;font-size:.95rem;font-weight:600">${esc(e.nom)}</h4>` +
          `<span class="badge" style="--tint:${s.tint};--fg:${s.fg}">${s.emoji} ${esc(e.categorie)}</span></div>` +
          `<p class="loc">${e.communes === "ALL" ? "🏝️" : "📍"} ${esc(communesLabel(e.communes))}</p>` +
          `<p class="dates">${fmtRange(e)}</p>` +
          (u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">site officiel ↗</a>` : "") +
          `</li>`;
      }).join("") + "</ul>";
  const dlg = document.getElementById("detail");
  dlg.innerHTML =
    `<div class="dhead"><div><span class="label">${evs.length} événement${evs.length > 1 ? "s" : ""}</span>` +
    `<h3 id="dtitle" style="text-transform:capitalize">${esc(title)}</h3></div>` +
    `<button class="close" aria-label="Fermer">✕</button></div>${body}`;
  dlg.querySelector(".close").onclick = () => dlg.close();
  dlg.showModal();
}

// Click on the backdrop → close.
document.getElementById("detail").addEventListener("click", e => {
  if (e.target.id === "detail") e.target.close();
});
</script>
</body>
</html>
