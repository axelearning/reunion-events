<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Agenda ouvert et collaboratif des événements de l'île de La Réunion.">
<title>Événements de La Réunion</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌋</text></svg>">
<style>
  :root {
    color-scheme: light; /* thème blanc figé, comme le prototype */

    /* — Surfaces (design system Vigie) — */
    --background: #f7f8fa;
    --foreground: #141c2e;
    --card: #ffffff;
    --card-elevated: #f0f3f8;
    --cell: #f4f6fa;
    --popover: #ffffff;
    --muted: #eef0f4;
    --muted-fg: #5f7089;
    --text-secondary: #3a4e6e;
    --border: #d8dce5;
    --border-strong: #c5cbd8;
    --primary: #4a6fa5;
    --primary-fg: #ffffff;

    /* — États « signal » → une catégorie, une couleur (bg + texte) — */
    --Culture-bg: #e6eef8;           --Culture-fg: #2c5490;
    --Sport-bg: #e8f3ec;             --Sport-fg: #2f7d4f;
    --Religieux-bg: #f6efe2;         --Religieux-fg: #7a5d20;
    --Ferie-bg: rgba(220,74,74,.10); --Ferie-fg: #991b1b;

    /* — Échelle de rayons — */
    --r-badge: 3px; --r-sm: 5px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px; --r-2xl: 16px;

    /* — Élévation — */
    --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
    --shadow-md: 0 2px 8px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --shadow-2xl: 0 12px 32px rgba(0,0,0,.12);

    /* — Mouvement — */
    --motion-micro: 140ms; --motion-standard: 240ms;
    --ease-expo: cubic-bezier(.16,1,.3,1);
    --ease-standard: cubic-bezier(.2,0,0,1);

    /* Geist est la typo du prototype ; system-ui en repli (police non embarquée ici). */
    --font-sans: "Geist Variable", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font: 16px/1.5 var(--font-sans); margin: 0 auto; padding: 2rem 1.25rem; max-width: 64rem;
    min-height: 100vh; display: flex; flex-direction: column; background: var(--background); color: var(--foreground);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  /* section-label (mono role : chiffres tabulaires, casse haute serrée) */
  .label { font-size: 10px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  header h1 { margin: .15rem 0 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
  .filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
  select, .today {
    font: inherit; font-size: .875rem; padding: .375rem .625rem; border: 1px solid var(--muted);
    border-radius: var(--r-md); background: var(--card); color: inherit; cursor: pointer;
    transition: background var(--motion-micro) var(--ease-standard), transform var(--motion-micro) var(--ease-standard);
  }
  .today { margin-left: auto; color: var(--muted-fg); background: none; }
  select:hover, .today:hover { background: var(--muted); }
  select:active, .today:active, .nav button:active { transform: scale(.98); }

  .card { margin-top: 1rem; flex: 1; display: flex; flex-direction: column; border: 1px solid var(--muted); border-radius: var(--r-xl); background: var(--card); padding: 1rem; }
  .nav { display: flex; align-items: center; justify-content: center; gap: .25rem; margin-bottom: .75rem; }
  .nav button { font: inherit; width: 2.75rem; height: 2.75rem; border: 0; border-radius: var(--r-md); background: none; color: var(--muted-fg); cursor: pointer; font-size: 1.3rem; transition: background var(--motion-micro) var(--ease-standard), transform var(--motion-micro) var(--ease-standard); }
  .nav button:hover { background: var(--muted); }
  .nav h2 { margin: 0; min-width: 10rem; text-align: center; font-size: 1.125rem; font-weight: 700; }

  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
  #days { flex: 1; }
  .wd { padding: .375rem 0; text-align: center; font: 600 11px/1 var(--font-sans); font-variant-numeric: tabular-nums; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-fg); }
  .day {
    display: flex; flex-direction: column; padding: .375rem; border: 0; border-radius: var(--r-sm);
    background: var(--cell); text-align: left; cursor: pointer; color: inherit; overflow: hidden;
    transition: transform var(--motion-micro) var(--ease-standard), box-shadow var(--motion-micro) var(--ease-standard);
  }
  .day:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .day.out { visibility: hidden; pointer-events: none; }
  .day.past { opacity: .4; filter: saturate(.3); }
  /* Aujourd'hui : liseré discret + numéro en accent (pas de pastille pleine — comme le prototype). */
  .day.today { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--muted-fg) 30%, transparent); }
  .daynum { align-self: flex-start; font-size: 11px; font-weight: 500; color: var(--muted-fg); }
  .day.today .daynum { font-weight: 700; color: var(--primary); }
  .chips { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
  .chip {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 1px 4px; border-radius: var(--r-sm); font-size: 10px; line-height: 1.35;
    background: var(--tint); color: var(--fg);
  }
  .more { padding: 0 4px; font-size: 10px; color: var(--muted-fg); }

  dialog {
    width: 100%; max-width: 28rem; border: 1px solid var(--border-strong); border-radius: var(--r-2xl);
    background: var(--popover); color: var(--foreground); padding: 1.5rem; box-shadow: var(--shadow-2xl);
  }
  dialog::backdrop { background: #00000080; }
  dialog[open] { animation: slide-up var(--motion-standard) var(--ease-expo); }
  @keyframes slide-up { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } }
  .dhead { display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem; margin-bottom: 1rem; }
  .dhead h3 { margin: .15rem 0 0; font-size: 1.125rem; font-weight: 700; text-transform: capitalize; letter-spacing: -.01em; }
  .close { border: 0; background: none; font-size: 1.2rem; cursor: pointer; color: var(--muted-fg); padding: .25rem; }
  .close:hover { color: inherit; }
  .evlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .6rem; }
  .ev { border: 1px solid var(--border); border-radius: var(--r-lg); padding: .7rem .8rem; background: var(--card-elevated); }
  .evtop { display: flex; align-items: flex-start; justify-content: space-between; gap: .5rem; }
  .ev h4 { margin: 0; font-size: .95rem; font-weight: 600; }
  .badge { flex-shrink: 0; padding: 2px 6px; border-radius: var(--r-badge); font-size: 11px; background: var(--tint); color: var(--fg); white-space: nowrap; }
  .ev .loc { margin: .4rem 0 0; font-size: .875rem; color: var(--text-secondary); }
  .ev .dates { margin: .15rem 0 0; font: .78rem/1.4 var(--font-sans); font-variant-numeric: tabular-nums; color: var(--muted-fg); }
  .ev a, footer a { color: var(--primary); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 4px; transition: text-decoration-color var(--motion-micro), color var(--motion-micro); }
  .ev a { font-size: .78rem; }
  .ev a:hover, footer a:hover { text-decoration-color: var(--primary); }
  .noev { color: var(--muted-fg); font-size: .9rem; }

  footer { margin-top: 1.5rem; text-align: center; font-size: .82rem; color: var(--muted-fg); }
  a { color: inherit; }
</style>
</head>
<body>
<header>
  <span class="label">Agenda collaboratif · La Réunion</span>
  <h1>Calendrier des événements</h1>
  <div class="filters">
    <select id="cat" aria-label="Filtrer par catégorie"></select>
    <select id="commune" aria-label="Filtrer par commune"></select>
    <button id="today" class="today" hidden>aujourd'hui</button>
  </div>
</header>

<main class="card">
  <div class="nav">
    <button id="prev" aria-label="Mois précédent">‹</button>
    <h2 id="month"></h2>
    <button id="next" aria-label="Mois suivant">›</button>
  </div>
  <div class="grid" id="weekdays"></div>
  <div class="grid" id="days"></div>
</main>

<dialog id="detail" aria-labelledby="dtitle"></dialog>

<footer>
  <a href="https://github.com/axelearning/reunion-events">proposez un événement sur GitHub ↗</a></footer>

<script>
"use strict";

// Parseur CSV minimal (RFC 4180) : champs entre guillemets, virgules internes, "" échappés.
function parseCSV(text) {
  const rows = [[]];
  let field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { rows[rows.length - 1].push(field); field = ""; }
    else if (c === "\n") { rows[rows.length - 1].push(field); field = ""; rows.push([]); }
    else if (c !== "\r") field += c;
  }
  rows[rows.length - 1].push(field);
  return rows.filter(r => r.length > 1 || r[0] !== "");
}

// Le CSV est modifiable par n'importe qui via PR : tout contenu est traité comme hostile.
function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function safeUrl(s) {
  try { return ["http:", "https:"].includes(new URL(s).protocol) ? s : null; }
  catch { return null; }
}

// Une catégorie → un emoji + un couple de tokens « signal » (fond tinté + texte).
const CATS = {
  Culture: { emoji: "🎭", tint: "var(--Culture-bg)", fg: "var(--Culture-fg)" },
  Sport: { emoji: "🏃", tint: "var(--Sport-bg)", fg: "var(--Sport-fg)" },
  Religieux: { emoji: "🪔", tint: "var(--Religieux-bg)", fg: "var(--Religieux-fg)" },
  "Jour férié": { emoji: "🎉", tint: "var(--Ferie-bg)", fg: "var(--Ferie-fg)" },
};
const catStyle = c => CATS[c] || { emoji: "📅", tint: "var(--muted)", fg: "var(--muted-fg)" };
const communesLabel = c => c === "ALL" ? "Toute l'île" : c.split("|").join(", ");

const MONTHS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const WEEKDAYS = ["lun.","mar.","mer.","jeu.","ven.","sam.","dim."];
const fmtDate = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", year: "numeric" });
const fmtFull = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

function iso(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function fmtRange(e) {
  const d = new Date(e.date_debut + "T00:00:00");
  if (isNaN(d)) return esc(e.date_debut);
  const f = e.date_fin ? new Date(e.date_fin + "T00:00:00") : null;
  return f && !isNaN(f) && e.date_fin !== e.date_debut
    ? `${fmtDate.format(d)} → ${fmtDate.format(f)}`
    : fmtDate.format(d);
}

const now = new Date();
const todayIso = iso(now);
let all = [];
let cursor = { y: now.getFullYear(), m: now.getMonth() };
let fCat = "", fCommune = "";

function filtered() {
  return all.filter(e =>
    (!fCat || e.categorie === fCat) &&
    (!fCommune || e.communes === "ALL" || e.communes.split("|").includes(fCommune)));
}
function eventsOn(key, list) {
  return list.filter(e => key >= e.date_debut && key <= (e.date_fin || e.date_debut));
}

fetch("reunion_events.csv")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(text => {
    const rows = parseCSV(text.trim());
    const headers = rows[0];
    all = rows.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h, (r[i] ?? "").trim()])));
    initFilters();
    render();
  })
  .catch(() => {
    document.querySelector("main").innerHTML = '<p class="noev" style="text-align:center;padding:2rem">Impossible de charger les données.</p>';
  });

function initFilters() {
  const communes = [...new Set(all.flatMap(e => e.communes === "ALL" ? [] : e.communes.split("|")))].sort((a, b) => a.localeCompare(b, "fr"));
  const catSel = document.getElementById("cat");
  catSel.innerHTML = '<option value="">Toutes catégories</option>' +
    Object.keys(CATS).map(c => `<option value="${esc(c)}">${catStyle(c).emoji} ${esc(c)}</option>`).join("");
  document.getElementById("commune").innerHTML = '<option value="">Toute l\'île</option>' +
    communes.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");

  document.getElementById("weekdays").innerHTML = WEEKDAYS.map(w => `<div class="wd">${w}</div>`).join("");

  catSel.onchange = e => { fCat = e.target.value; render(); };
  document.getElementById("commune").onchange = e => { fCommune = e.target.value; render(); };
  document.getElementById("prev").onclick = () => move(-1);
  document.getElementById("next").onclick = () => move(1);
  document.getElementById("today").onclick = () => { cursor = { y: now.getFullYear(), m: now.getMonth() }; render(); };
}

function move(delta) {
  const d = new Date(cursor.y, cursor.m + delta, 1);
  cursor = { y: d.getFullYear(), m: d.getMonth() };
  render();
}

function render() {
  const { y, m } = cursor;
  const list = filtered();
  document.getElementById("month").textContent = `${MONTHS[m]} ${y}`;
  const isCurrent = y === now.getFullYear() && m === now.getMonth();
  document.getElementById("today").hidden = isCurrent;

  const offset = (new Date(y, m, 1).getDay() + 6) % 7; // lundi = 0
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const count = Math.ceil((offset + daysInMonth) / 7) * 7;
  const days = document.getElementById("days");
  days.style.gridTemplateRows = `repeat(${count / 7}, minmax(72px, 1fr))`;

  let html = "";
  for (let i = 0; i < count; i++) {
    const d = new Date(y, m, 1 - offset + i);
    const key = iso(d);
    const inMonth = d.getMonth() === m;
    if (!inMonth) { html += '<div class="day out"></div>'; continue; }
    const evs = eventsOn(key, list);
    const cls = ["day", key < todayIso ? "past" : "", key === todayIso ? "today" : ""].join(" ").trim();
    const label = `${fmtFull.format(d)}, ${evs.length === 0 ? "aucun événement" : evs.length + " événement" + (evs.length > 1 ? "s" : "")}`;
    const chips = evs.slice(0, 3).map(e => {
      const s = catStyle(e.categorie);
      return `<span class="chip" style="--tint:${s.tint};--fg:${s.fg}" title="${esc(e.nom)}">${esc(e.nom)}</span>`;
    }).join("");
    const more = evs.length > 3 ? `<span class="more">+${evs.length - 3}</span>` : "";
    html += `<button class="${cls}" data-key="${key}" aria-label="${esc(label)}"` +
      `${key === todayIso ? ' aria-current="date"' : ""}>` +
      `<span class="daynum">${d.getDate()}</span><span class="chips">${chips}${more}</span></button>`;
  }
  days.innerHTML = html;
  days.querySelectorAll(".day:not(.out)").forEach(b => b.onclick = () => openDay(b.dataset.key));
}

function openDay(key) {
  const evs = eventsOn(key, filtered());
  const title = fmtFull.format(new Date(key + "T00:00:00"));
  const body = evs.length === 0
    ? '<p class="noev">Aucun événement ce jour.</p>'
    : '<ul class="evlist">' + evs.map(e => {
        const s = catStyle(e.categorie);
        const u = safeUrl(e.lien);
        return `<li class="ev"><div class="evtop"><h4>${esc(e.nom)}</h4>` +
          `<span class="badge" style="--tint:${s.tint};--fg:${s.fg}">${esc(e.categorie)}</span></div>` +
          `<p class="loc">📍 ${esc(communesLabel(e.communes))}</p>` +
          `<p class="dates">${fmtRange(e)}</p>` +
          (u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">site officiel ↗</a>` : "") +
          `</li>`;
      }).join("") + "</ul>";
  const dlg = document.getElementById("detail");
  dlg.innerHTML =
    `<div class="dhead"><div><span class="label">${evs.length} événement${evs.length > 1 ? "s" : ""}</span>` +
    `<h3 id="dtitle">${esc(title)}</h3></div>` +
    `<button class="close" aria-label="Fermer">✕</button></div>${body}`;
  dlg.querySelector(".close").onclick = () => dlg.close();
  dlg.showModal();
}

// Clic sur le fond (backdrop) → fermeture.
document.getElementById("detail").addEventListener("click", e => {
  if (e.target.id === "detail") e.target.close();
});
</script>
</body>
</html>
